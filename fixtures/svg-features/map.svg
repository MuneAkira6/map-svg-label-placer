  <path id="curvy" d="m20 40 c30-20 60 20 90 0 s60-20 90 0 q30 20 60 0 t60 0 h20 v30 l-30 10 z"/>
  <g transform="rotate(15 200 150) scale(1.1)">
    <polyline points="40,200 80,220 120,205 160,230"/>
    <line x1="200" y1="60" x2="260" y2="90" style="stroke:#a00;stroke-width:3"/>
  </g>
  <path d="M300 200 A20 20 0 0 1 340 200"/>
  <path d="M10,10 L30,30" style="stroke: none"/>
</g>
<g transform="matrix(0.9,0.1,-0.1,0.9,20,10)"><path d="M150,250 L190,240 L230,262" stroke="#060" stroke-width="1.5" fill="none"/></g>
<g transform="skewX(10)"><path d="M300,250 V280" stroke="#060" fill="none"/></g>
