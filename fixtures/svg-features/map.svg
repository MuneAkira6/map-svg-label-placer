<path id="river" d="M0,120 C80,100 120,160 200,130 S320,90 400,110" fill="none" stroke="#39c" stroke-width="3"/>
<path id="park" d="M60,180 L120,175 L125,215 L65,220 Z" fill="#cfc" stroke="#090" stroke-width="0.5"/>
<g display="none"><path d="M0 0 L400 300" stroke="#000"/></g>
<path d="M0 300 L400 0" stroke="#000" visibility="hidden"/>
<rect x="30" y="250" width="50" height="20" transform="rotate(-20 55 260)" fill="#c00"/>
<rect x="300" y="20" width="60" height="30" fill="none" stroke="#000" stroke-width="1.5"/>
<rect x="2" y="2" width="396" height="296" fill="none" stroke="#999" stroke-width="1"/>
<rect x="150" y="20" width="20" height="10" fill="none"/>
<circle cx="120" cy="80" r="5" fill="#000"/>
